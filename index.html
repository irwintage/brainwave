<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Brainwave - Chrysasynth Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0d0f12"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="description" content="Binaural beats studio — Chrysasynth"/>
  <link rel="manifest" href="manifest.json"/>
  <style>

@font-face{font-family:'Cinzel';src:url('./cinzel-v26-latin-regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Cinzel';src:url('./cinzel-v26-latin-500.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Inter';src:url('./inter-v20-latin-300.woff2') format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Inter';src:url('./inter-v20-latin-regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Inter';src:url('./inter-v20-latin-500.woff2') format('woff2');font-weight:500;font-display:swap}

:root{
  --bg:#0d0f12;
  --bg2:#090a0d;
  --t1:#f4f6fb;
  --t2:rgba(244,246,251,.72);
  --t3:rgba(244,246,251,.42);
  --stroke:rgba(255,255,255,.075);
  --surface:rgba(255,255,255,.03);
  --band-c1:#54D9FF;
  --band-c2:#8B5CFF;
  --band-glow:rgba(84,217,255,.20);
  --font-d:'Cinzel',serif;
  --font-b:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{
  min-height:100%;
  background:var(--bg);
  color-scheme:dark;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
body{
  min-height:100vh;
  min-height:100dvh;
  font-family:var(--font-b);
  background:var(--bg);
  color:var(--t1);
  overflow-x:hidden;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--band-c1) 12%,transparent),transparent 31%),
    radial-gradient(circle at 62% 37%,color-mix(in srgb,var(--band-c2) 9%,transparent),transparent 28%),
    linear-gradient(180deg,#111318 0%,var(--bg) 50%,var(--bg2) 100%);
  transition:background .5s ease;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.035),transparent 38%),
    linear-gradient(120deg,transparent 0 46%,rgba(255,255,255,.013) 50%,transparent 54%);
}
button,input{font:inherit}
.app{
  width:min(100%,460px);
  min-height:100vh;
  min-height:100dvh;
  margin:0 auto;
  padding:max(18px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:18px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
}
.eyebrow{
  font-size:.58rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--t3);
  margin-bottom:4px;
}
.product-title{
  font-family:var(--font-d);
  font-size:1.35rem;
  font-weight:500;
  letter-spacing:.02em;
}
.status-stack{
  display:flex;
  align-items:center;
  gap:6px;
}
.status-pill{
  min-height:29px;
  padding:0 9px;
  border:1px solid var(--stroke);
  border-radius:999px;
  background:var(--surface);
  color:var(--t2);
  display:inline-flex;
  align-items:center;
  font-size:.58rem;
  font-weight:500;
  letter-spacing:.04em;
  white-space:nowrap;
}
.status-pill.primary{
  color:var(--band-c1);
  border-color:color-mix(in srgb,var(--band-c1) 24%,transparent);
  background:color-mix(in srgb,var(--band-c1) 5%,var(--surface));
}
.visual-stage{
  position:relative;
  min-height:300px;
  display:grid;
  place-items:center;
}
.visual-stage::before{
  content:"";
  position:absolute;
  width:88%;
  aspect-ratio:1.35;
  border-radius:50%;
  background:radial-gradient(ellipse,color-mix(in srgb,var(--band-c1) 13%,transparent),transparent 66%);
  filter:blur(30px);
  pointer-events:none;
}
#wave{
  width:100%;
  height:290px;
  display:block;
  border-radius:24px;
  position:relative;
  z-index:1;
}
.visual-overlay{
  position:absolute;
  z-index:2;
  left:12px;
  right:12px;
  bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.micro-pill{
  min-height:28px;
  padding:0 9px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.055);
  background:rgba(9,10,13,.46);
  backdrop-filter:blur(10px);
  display:inline-flex;
  align-items:center;
  color:var(--t3);
  font-size:.58rem;
}
.micro-pill.hz{color:var(--band-c1)}
.band-block{display:flex;flex-direction:column;gap:9px}
.section-label{
  font-size:.58rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--t3);
}
.bands-row{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}
.band-chip{
  min-height:54px;
  padding:8px 5px;
  border:1px solid rgba(255,255,255,.065);
  border-radius:15px;
  background:rgba(255,255,255,.026);
  color:var(--t2);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  cursor:pointer;
  user-select:none;
  transition:.16s ease;
}
.band-chip .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--dot-color,var(--band-c1));
  box-shadow:0 0 8px color-mix(in srgb,var(--dot-color,var(--band-c1)) 60%,transparent);
}
.band-chip .name{font-size:.62rem;font-weight:500}
.band-chip .hz{font-size:.51rem;color:var(--t3)}
.band-chip.active{
  border-color:color-mix(in srgb,var(--band-c1) 42%,transparent);
  background:color-mix(in srgb,var(--band-c1) 6%,rgba(255,255,255,.024));
  color:var(--t1);
  box-shadow:0 0 16px var(--band-glow);
}
.controls{
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.05);
  background:rgba(255,255,255,.022);
}
.control{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.control-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.control-name{
  font-size:.61rem;
  letter-spacing:.10em;
  text-transform:uppercase;
  color:var(--t2);
}
.control-value{
  font-size:.64rem;
  font-weight:500;
  color:var(--band-c1);
  font-variant-numeric:tabular-nums;
}
.slider-wrap{
  position:relative;
  height:20px;
  display:flex;
  align-items:center;
}
.slider-track,.slider-fill{
  position:absolute;
  left:0;
  height:3px;
  border-radius:999px;
  pointer-events:none;
}
.slider-track{right:0;background:rgba(255,255,255,.10)}
.slider-fill{background:linear-gradient(90deg,var(--band-c1),var(--band-c2))}
input[type=range]{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:20px;
  background:transparent;
  position:relative;
  z-index:1;
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:16px;height:16px;border-radius:50%;
  background:#eef3f7;
  border:3px solid #17191d;
  box-shadow:0 0 0 1px rgba(255,255,255,.10),0 0 12px var(--band-glow);
}
input[type=range]::-moz-range-thumb{
  width:10px;height:10px;border-radius:50%;
  background:#eef3f7;
  border:3px solid #17191d;
  box-shadow:0 0 0 1px rgba(255,255,255,.10),0 0 12px var(--band-glow);
}
.timer-block{display:flex;flex-direction:column;gap:8px}
.timer-row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.t-chip{
  min-height:30px;
  padding:0 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.065);
  background:rgba(255,255,255,.025);
  color:var(--t2);
  display:inline-flex;
  align-items:center;
  font-size:.60rem;
  cursor:pointer;
}
.t-chip.active{
  color:color-mix(in srgb,var(--band-c2) 76%,white);
  border-color:color-mix(in srgb,var(--band-c2) 40%,transparent);
  background:color-mix(in srgb,var(--band-c2) 6%,rgba(255,255,255,.025));
}
.actions{
  display:grid;
  grid-template-columns:1.3fr .85fr;
  gap:8px;
}
.btn{
  min-height:44px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.075);
  background:rgba(255,255,255,.03);
  color:var(--t2);
  cursor:pointer;
  font-size:.69rem;
  font-weight:500;
}
.btn.primary{
  color:#dff8ff;
  border-color:color-mix(in srgb,var(--band-c1) 24%,transparent);
  background:color-mix(in srgb,var(--band-c1) 7%,rgba(255,255,255,.025));
  box-shadow:0 0 20px color-mix(in srgb,var(--band-c1) 8%,transparent);
}
.utility{
  display:flex;
  justify-content:center;
}
.utility .btn{
  min-height:34px;
  padding:0 12px;
  border-radius:999px;
  font-size:.58rem;
  background:transparent;
}
@media(max-width:380px){
  .app{gap:14px;padding-left:13px;padding-right:13px}
  .product-title{font-size:1.22rem}
  .status-pill{font-size:.54rem;padding:0 7px}
  .visual-stage{min-height:250px}
  #wave{height:240px}
  .band-chip{min-height:50px}
  .band-chip .name{font-size:.57rem}
}
@media(max-height:720px){
  .app{gap:12px}
  .visual-stage{min-height:220px}
  #wave{height:210px}
  .controls{gap:10px;padding:11px}
  .band-chip{min-height:48px}
}

  
/* ============================================================
   BRAINWAVE — ROBUST FULLSCREEN SPLASH
   ============================================================ */
body.bw-splash-open{
  overflow:hidden;
}

.bw-splash{
  position:fixed;
  inset:0;
  z-index:99999;
  display:grid;
  grid-template-rows:auto 1fr auto;
  width:100%;
  height:100vh;
  height:100dvh;
  padding:
    max(22px, env(safe-area-inset-top))
    20px
    max(26px, env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 50% 46%, rgba(84,217,255,.045), transparent 24%),
    radial-gradient(circle at 50% 54%, rgba(139,92,255,.045), transparent 30%),
    linear-gradient(180deg,#111318 0%,#0d0f12 54%,#090a0d 100%);
  overflow:hidden;
  opacity:1;
  visibility:visible;
  transition:opacity .5s ease, visibility .5s ease;
}

.bw-splash.is-leaving{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.bw-splash-canvas{
  position:absolute;
  inset:0;
  z-index:0;
  width:100%;
  height:100%;
  pointer-events:none !important;
}

.bw-splash-header,
.bw-splash-main,
.bw-splash-footer{
  position:relative;
  z-index:2;
  pointer-events:auto;
}

.bw-splash-header{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.bw-splash-brand{
  font-size:.59rem;
  font-weight:500;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:rgba(244,246,251,.42);
}

.bw-splash-main{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  pointer-events:none;
}

.bw-splash-title{
  font-family:var(--font-d);
  font-size:clamp(1.55rem,7vw,2rem);
  font-weight:500;
  letter-spacing:.045em;
  color:var(--t1);
  text-shadow:
    0 0 24px rgba(84,217,255,.05),
    0 0 34px rgba(139,92,255,.04);
}

.bw-splash-subtitle{
  margin-top:9px;
  color:var(--t3);
  font-size:.67rem;
  letter-spacing:.04em;
}

.bw-splash-footer{
  display:flex;
  justify-content:center;
  align-items:flex-end;
}

.bw-enter{
  position:relative;
  z-index:10;
  min-width:162px;
  min-height:46px;
  padding:0 24px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.11);
  background:#f1f3f6;
  color:#111318;
  font-family:var(--font-b);
  font-size:.68rem;
  font-weight:500;
  letter-spacing:.11em;
  text-transform:uppercase;
  cursor:pointer;
  pointer-events:auto !important;
  touch-action:manipulation;
  box-shadow:
    0 10px 28px rgba(0,0,0,.30),
    0 0 0 1px rgba(255,255,255,.02) inset;
  transition:transform .12s ease, opacity .12s ease;
}

.bw-enter:active{
  transform:scale(.985);
}

@media(max-height:700px){
  .bw-splash{
    padding-top:max(16px, env(safe-area-inset-top));
    padding-bottom:max(18px, env(safe-area-inset-bottom));
  }
  .bw-splash-title{
    font-size:1.45rem;
  }
}

   BRAINWAVE V3.4 — MOBILE FIT POLISH
   ============================================================ */

.bw-splash-footer{
  padding-bottom:34px;
}

.app{

</style>
</head>

<body class="bw-splash-open">

<div class="bw-splash" id="bwSplash">
  <canvas class="bw-splash-canvas" id="bwSplashCanvas" aria-hidden="true"></canvas>

  <div class="bw-splash-header">
    <div class="bw-splash-brand">Chrysasynth</div>
  </div>

  <div class="bw-splash-main">
    <div class="bw-splash-title">Brainwave</div>
    <div class="bw-splash-subtitle">Binaural frequency generator</div>
  </div>

  <div class="bw-splash-footer">
    <button class="bw-enter" id="bwEnterBtn" type="button">Enter</button>
  </div>
</div>

<div class="app">

  <header class="topbar">
    <div>
      <div class="eyebrow">Chrysasynth</div>
      <div class="product-title">Brainwave</div>
    </div>
    <div class="status-stack">
      <span class="status-pill primary" id="stateChip">Alpha · 10 Hz</span>
      <span class="status-pill" id="timerChip">∞</span>
    </div>
  </header>

  <section class="visual-stage">
    <canvas id="wave" aria-label="Waveform visualizer"></canvas>
    <div class="visual-overlay">
      <span class="micro-pill">Headphones recommended</span>
      <span class="micro-pill hz" id="metaHz">200 Hz · +10.0 Hz</span>
    </div>
  </section>

  <section class="band-block">
    <div class="section-label">Brainwave band</div>
    <div class="bands-row" id="bandsRow"></div>
  </section>

  <section class="controls">
    <div class="control">
      <div class="control-head">
        <span class="control-name">Carrier</span>
        <span class="control-value"><span id="carrierV">200</span> Hz</span>
      </div>
      <div class="slider-wrap">
        <div class="slider-track"></div>
        <div class="slider-fill" id="carrierFill"></div>
        <input type="range" id="carrier" min="100" max="400" step="1" value="200"/>
      </div>
    </div>

    <div class="control">
      <div class="control-head">
        <span class="control-name">Beat</span>
        <span class="control-value"><span id="beatV">10.0</span> Hz</span>
      </div>
      <div class="slider-wrap">
        <div class="slider-track"></div>
        <div class="slider-fill" id="beatFill"></div>
        <input type="range" id="beat" min="0.5" max="40" step="0.1" value="10"/>
      </div>
    </div>

    <div class="control">
      <div class="control-head">
        <span class="control-name">Volume</span>
        <span class="control-value" id="volV">70%</span>
      </div>
      <div class="slider-wrap">
        <div class="slider-track"></div>
        <div class="slider-fill" id="volFill"></div>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="0.7"/>
      </div>
    </div>

    <div class="timer-block">
      <div class="section-label">Session timer</div>
      <div class="timer-row" id="timerChips">
        <div class="t-chip active" data-val="0">∞</div>
        <div class="t-chip" data-val="300000">5 min</div>
        <div class="t-chip" data-val="600000">10 min</div>
        <div class="t-chip" data-val="1200000">20 min</div>
        <div class="t-chip" data-val="3600000">60 min</div>
      </div>
    </div>
  </section>

  <section class="actions">
    <button class="btn primary" id="startBtn">Start</button>
    <button class="btn" id="stopBtn">Stop</button>
  </section>
<div id="brandDot" style="display:none"></div>
</div>

<script>

// ── BAND DATA ──────────────────────────────────────────────────────────────
const BANDS = [
  { id:"delta", name:"Delta", hz:2,  desc:"Deep sleep", c1:"#6688FF", c2:"#6F5CFF", glow:"rgba(102,136,255,0.20)" },
  { id:"theta", name:"Theta", hz:6,  desc:"Meditation", c1:"#7A72FF", c2:"#875CFF", glow:"rgba(122,114,255,0.20)" },
  { id:"alpha", name:"Alpha", hz:10, desc:"Relaxation", c1:"#54D9FF", c2:"#8B5CFF", glow:"rgba(84,217,255,0.20)" },
  { id:"beta",  name:"Beta",  hz:20, desc:"Focus",      c1:"#8B7CFF", c2:"#B35CFF", glow:"rgba(139,124,255,0.20)" },
  { id:"gamma", name:"Gamma", hz:35, desc:"Peak state", c1:"#B76CFF", c2:"#D05CFF", glow:"rgba(183,108,255,0.20)" },
];

const rs = document.documentElement.style;
let currentBand = BANDS[2]; // alpha default
let timerVal = 0;
let stopTimerID = null;
let countdownID = null;
let timerEndsAt = 0;

function formatRemaining(ms) {
  const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
}

function stopCountdown() {
  if (countdownID !== null) {
    clearInterval(countdownID);
    countdownID = null;
  }
  timerEndsAt = 0;
}

function startCountdown() {
  stopCountdown();

  if (timerVal <= 0) {
    timerChip.textContent = "∞";
    return;
  }

  timerEndsAt = Date.now() + timerVal;

  const updateCountdown = () => {
    const remaining = timerEndsAt - Date.now();
    timerChip.textContent = formatRemaining(remaining);

    if (remaining <= 0) {
      stopCountdown();
    }
  };

  updateCountdown();
  countdownID = setInterval(updateCountdown, 250);
}

// ── DOM ────────────────────────────────────────────────────────────────────
const brandDot   = document.getElementById("brandDot");
const stateChip  = document.getElementById("stateChip");
const timerChip  = document.getElementById("timerChip");
const metaHz     = document.getElementById("metaHz");
const carrierEl  = document.getElementById("carrier");
const carrierV   = document.getElementById("carrierV");
const beatEl     = document.getElementById("beat");
const beatV      = document.getElementById("beatV");
const volEl      = document.getElementById("vol");
const volV       = document.getElementById("volV");
const bandsRow   = document.getElementById("bandsRow");
const timerChips = document.getElementById("timerChips");
const startBtn   = document.getElementById("startBtn");
const stopBtn    = document.getElementById("stopBtn");
const fsBtn      = document.getElementById("fsBtn");
const canvas     = document.getElementById("wave");
const ctx2d      = canvas.getContext("2d");

// ── AUDIO ──────────────────────────────────────────────────────────────────
let actx, oscL, oscR, panL, panR, gainL, gainR, master, analyser, rafId;
let targetVol = 0.7;

function setupAudio() {
  if (actx) return;
  actx    = new (window.AudioContext || window.webkitAudioContext)();
  oscL    = actx.createOscillator(); oscL.type = "sine";
  oscR    = actx.createOscillator(); oscR.type = "sine";
  panL    = actx.createStereoPanner ? actx.createStereoPanner() : null;
  panR    = actx.createStereoPanner ? actx.createStereoPanner() : null;
  gainL   = actx.createGain(); gainR = actx.createGain();
  master  = actx.createGain(); master.gain.value = 0;
  analyser = actx.createAnalyser(); analyser.fftSize = 2048;

  if (panL) { oscL.connect(panL); panL.pan.value = -1; panL.connect(gainL); }
  else oscL.connect(gainL);
  if (panR) { oscR.connect(panR); panR.pan.value =  1; panR.connect(gainR); }
  else oscR.connect(gainR);

  gainL.connect(master); gainR.connect(master);
  master.connect(actx.destination);
  master.connect(analyser);
  gainL.gain.value = 0.5; gainR.gain.value = 0.5;

  updateFrequencies(true);
  oscL.start(); oscR.start();
}

function updateFrequencies(init = false) {
  const fc = parseFloat(carrierEl.value);
  const fb = parseFloat(beatEl.value);
  carrierV.textContent = Math.round(fc);
  beatV.textContent    = fb.toFixed(1);
  metaHz.textContent   = `${Math.round(fc)} Hz · +${fb.toFixed(1)} Hz`;
  updateSliderFills();
  if (!actx) return;
  const t   = actx.currentTime;
  const tau = init ? 0.02 : 0.06;
  oscL.frequency.setTargetAtTime(fc,      t, tau);
  oscR.frequency.setTargetAtTime(fc + fb, t, tau);
}

function fadeTo(g, v, dur = 0.12) {
  if (!actx) return;
  const now = actx.currentTime;
  g.gain.cancelScheduledValues(now);
  g.gain.setValueAtTime(g.gain.value, now);
  g.gain.linearRampToValueAtTime(v, now + dur);
}

async function startAudio() {
  setupAudio();
  await actx.resume();
  clearTimeout(stopTimerID);
  fadeTo(master, targetVol, 0.14);
  brandDot.classList.add("playing");
  startBtn.textContent = "Playing";

  if (timerVal > 0) {
    startCountdown();
    stopTimerID = setTimeout(stopAudio, timerVal);
  } else {
    stopCountdown();
    timerChip.textContent = "∞";
  }
  animate();
}

async function stopAudio() {
  if (!actx) return;
  fadeTo(master, 0, 0.14);
  brandDot.classList.remove("playing");
  startBtn.textContent = "Start";
  setTimeout(async () => {
    await actx.suspend();
    cancelAnimationFrame(rafId); rafId = null;
    clearTimeout(stopTimerID);
    stopCountdown();
    timerChip.textContent = timerVal > 0 ? `${Math.round(timerVal / 60000)} min` : "∞";
    drawWave(true);
  }, 160);
}

// ── WAVEFORM ───────────────────────────────────────────────────────────────
function animate() { drawWave(); rafId = requestAnimationFrame(animate); }

function drawWave(clearOnly = false) {
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const W = canvas.width  = canvas.clientWidth  * DPR;
  const H = canvas.height = canvas.clientHeight * DPR;
  ctx2d.setTransform(1, 0, 0, 1, 0, 0);
  ctx2d.clearRect(0, 0, W, H);

  // bg
  const bg = ctx2d.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "rgba(16,19,24,0.70)");
  bg.addColorStop(1, "rgba(9,10,13,0.82)");
  ctx2d.fillStyle = bg;
  ctx2d.fillRect(0, 0, W, H);

  // subtle grid lines
  ctx2d.lineWidth = 1;
  ctx2d.strokeStyle = "rgba(255,255,255,0.04)";
  for (let y = H * 0.25; y < H; y += H * 0.25) {
    ctx2d.beginPath(); ctx2d.moveTo(0, y); ctx2d.lineTo(W, y); ctx2d.stroke();
  }

  // center line
  ctx2d.lineWidth = 1;
  ctx2d.strokeStyle = "rgba(255,255,255,0.06)";
  ctx2d.setLineDash([4, 6]);
  ctx2d.beginPath(); ctx2d.moveTo(0, H * 0.5); ctx2d.lineTo(W, H * 0.5); ctx2d.stroke();
  ctx2d.setLineDash([]);

  if (clearOnly) return;

  // get waveform data
  const buf = new Float32Array(analyser ? analyser.fftSize : 2048);
  if (analyser) analyser.getFloatTimeDomainData(buf);

  const c1 = currentBand.c1;
  const c2 = currentBand.c2;

  // shadow/glow pass
  const grad = ctx2d.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, c1);
  grad.addColorStop(0.5, c2);
  grad.addColorStop(1, c1);

  // glow layer
  ctx2d.save();
  ctx2d.globalAlpha = 0.18;
  ctx2d.lineWidth = Math.max(6, H / 50);
  ctx2d.strokeStyle = grad;
  ctx2d.filter = `blur(${Math.max(3, H / 80)}px)`;
  drawPath(buf, W, H);
  ctx2d.stroke();
  ctx2d.restore();

  // main line
  ctx2d.globalAlpha = 1;
  ctx2d.lineWidth = Math.max(2, H / 130);
  ctx2d.strokeStyle = grad;
  ctx2d.shadowColor  = c1;
  ctx2d.shadowBlur   = 10;
  drawPath(buf, W, H);
  ctx2d.stroke();
  ctx2d.shadowBlur = 0;
}

function drawPath(buf, W, H) {
  ctx2d.beginPath();
  const step = Math.max(1, Math.floor(buf.length / W));
  for (let i = 0; i < W; i++) {
    const v = buf[i * step] || 0;
    const y = (0.5 - v * 0.42) * H;
    if (i === 0) ctx2d.moveTo(i, y);
    else ctx2d.lineTo(i, y);
  }
}

// ── SLIDER FILLS ───────────────────────────────────────────────────────────
function updateSliderFills() {
  const sliders = [
    { el: carrierEl, fill: document.getElementById("carrierFill") },
    { el: beatEl,    fill: document.getElementById("beatFill")    },
    { el: volEl,     fill: document.getElementById("volFill")     },
  ];
  sliders.forEach(({ el, fill }) => {
    if (!fill) return;
    const pct = (el.value - el.min) / (el.max - el.min) * 100;
    fill.style.width = pct + "%";
  });
}

// ── BAND THEME ─────────────────────────────────────────────────────────────
function applyBandTheme(band) {
  currentBand = band;
  rs.setProperty("--band-c1",   band.c1);
  rs.setProperty("--band-c2",   band.c2);
  rs.setProperty("--band-glow", band.glow);
  stateChip.textContent = `${band.name} · ${band.hz} Hz`;
  metaHz.style.color = band.c1;
  updateSliderFills();
}

// ── BUILD BANDS ────────────────────────────────────────────────────────────
BANDS.forEach(band => {
  const chip = document.createElement("div");
  chip.className = "band-chip" + (band.id === "alpha" ? " active" : "");
  chip.style.setProperty("--dot-color", band.c1);
  chip.innerHTML = `
    <span class="dot"></span>
    <span class="name">${band.name}</span>
    <span class="hz">${band.hz} Hz</span>
  `;
  chip.addEventListener("click", () => {
    document.querySelectorAll("#bandsRow .band-chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    beatEl.value = band.hz;
    updateFrequencies();
    applyBandTheme(band);
    if (actx && actx.state === "running") updateFrequencies();
  });
  bandsRow.appendChild(chip);
});

// ── TIMER CHIPS ────────────────────────────────────────────────────────────
document.querySelectorAll(".t-chip").forEach(tc => {
  tc.addEventListener("click", () => {
    document.querySelectorAll(".t-chip").forEach(c => c.classList.remove("active"));
    tc.classList.add("active");
    timerVal = parseInt(tc.dataset.val, 10);

    if (actx && actx.state === "running") {
      clearTimeout(stopTimerID);

      if (timerVal > 0) {
        startCountdown();
        stopTimerID = setTimeout(stopAudio, timerVal);
      } else {
        stopCountdown();
        timerChip.textContent = "∞";
      }
    } else {
      timerChip.textContent = timerVal > 0 ? `${Math.round(timerVal / 60000)} min` : "∞";
    }
  });
});

// ── SLIDER EVENTS ──────────────────────────────────────────────────────────
carrierEl.addEventListener("input", () => updateFrequencies());
beatEl.addEventListener("input",    () => updateFrequencies());
volEl.addEventListener("input", () => {
  targetVol = parseFloat(volEl.value);
  volV.textContent = Math.round(targetVol * 100) + "%";
  updateSliderFills();
  if (actx && actx.state === "running") fadeTo(master, targetVol, 0.08);
});

// ── ACTIONS ────────────────────────────────────────────────────────────────
startBtn.addEventListener("click", startAudio);
stopBtn.addEventListener("click",  stopAudio);
if (fsBtn) {
  fsBtn.addEventListener("click", () => {
    const el = document.documentElement;
    const go = el.requestFullscreen || el.webkitRequestFullscreen;
    if (go) go.call(el);
  });
}

// ── INIT ───────────────────────────────────────────────────────────────────
applyBandTheme(BANDS[2]);
updateFrequencies();
volV.textContent = Math.round(parseFloat(volEl.value) * 100) + "%";
drawWave(true);

// AUTO-HEIGHT HOSTINGER
function reportH() {
  const h = document.documentElement.scrollHeight;
  try {
    window.parent.postMessage({ type:"setHeight", height:h }, "*");
    window.parent.postMessage({ iframe:true, height:h }, "*");
    window.parent.postMessage("height:"+h, "*");
  } catch(e) {}
}
window.addEventListener("load", reportH);
if (window.ResizeObserver) new ResizeObserver(reportH).observe(document.documentElement);
else window.addEventListener("resize", reportH);

</script>

<script>
(() => {
  const splash = document.getElementById("bwSplash");
  const canvas = document.getElementById("bwSplashCanvas");
  const enter = document.getElementById("bwEnterBtn");

  if (!splash || !canvas || !enter) return;

  const ctx = canvas.getContext("2d");
  let dpr = 1;
  let w = 0;
  let h = 0;
  let raf = 0;
  const started = performance.now();

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function streamPath(yBase, amp, freq, phase, time, skew){
    ctx.beginPath();

    for(let x = -50; x <= w + 50; x += 7){
      const nx = x / Math.max(1, w);
      const center = Math.exp(-Math.pow((nx - .5) / .24, 2));
      const y =
        yBase +
        Math.sin(nx * Math.PI * freq + phase + time * .72) * amp +
        Math.sin(nx * Math.PI * 1.7 - time * .36 + phase * .55) * amp * .28 +
        center * skew;

      if (x === -50) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
  }

  function paintStream(opts, time){
    const { y, amp, freq, phase, rgba, skew } = opts;

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    streamPath(y, amp, freq, phase, time, skew);
    ctx.strokeStyle = rgba(.07);
    ctx.lineWidth = 42;
    ctx.filter = "blur(20px)";
    ctx.stroke();

    streamPath(y, amp, freq, phase, time, skew);
    ctx.strokeStyle = rgba(.16);
    ctx.lineWidth = 19;
    ctx.filter = "blur(8px)";
    ctx.stroke();

    streamPath(y, amp, freq, phase, time, skew);
    ctx.strokeStyle = rgba(.52);
    ctx.lineWidth = 3;
    ctx.filter = "blur(.4px)";
    ctx.shadowColor = rgba(.5);
    ctx.shadowBlur = 18;
    ctx.stroke();

    streamPath(y, amp * .92, freq, phase + .08, time, skew * .85);
    ctx.strokeStyle = "rgba(245,250,255,.42)";
    ctx.lineWidth = .7;
    ctx.filter = "none";
    ctx.shadowBlur = 0;
    ctx.stroke();

    ctx.restore();
  }

  function frame(now){
    const t = (now - started) / 1000;
    ctx.clearRect(0, 0, w, h);

    const field = ctx.createRadialGradient(
      w * .5, h * .5, 0,
      w * .5, h * .5, Math.min(w, h) * .48
    );
    field.addColorStop(0, "rgba(110,110,255,.055)");
    field.addColorStop(.4, "rgba(84,217,255,.022)");
    field.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = field;
    ctx.fillRect(0, 0, w, h);

    paintStream({
      y:h * .39,
      amp:24,
      freq:3.15,
      phase:.2,
      skew:14,
      rgba:(a)=>`rgba(84,217,255,${a})`
    }, t);

    paintStream({
      y:h * .60,
      amp:27,
      freq:2.75,
      phase:2.15,
      skew:-16,
      rgba:(a)=>`rgba(139,92,255,${a})`
    }, t);

    // subtle central interference filaments
    ctx.save();
    ctx.globalAlpha = .28;
    ctx.lineWidth = .65;
    ctx.strokeStyle = "rgba(225,232,255,.18)";
    for(let k = 0; k < 3; k++){
      ctx.beginPath();
      for(let x = 0; x <= w; x += 8){
        const nx = x / Math.max(1, w);
        const y =
          h * .5 +
          Math.sin(nx * Math.PI * (5.4 + k * .5) + t * (.65 + k * .08)) * (3.5 + k) +
          Math.sin(nx * Math.PI * 2.3 - t * .44) * 2.4;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();

    raf = requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize, { passive:true });
  raf = requestAnimationFrame(frame);

  function closeSplash(){
    enter.disabled = true;
    splash.classList.add("is-leaving");
    document.body.classList.remove("bw-splash-open");

    window.setTimeout(() => {
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener("resize", resize);
      splash.remove();
    }, 540);
  }

  enter.addEventListener("click", closeSplash);
  enter.addEventListener("touchend", (e) => {
    e.preventDefault();
    closeSplash();
  }, { passive:false });
})();
</script>
